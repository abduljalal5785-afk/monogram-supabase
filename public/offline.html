<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Monogram — Offline</title>
<meta name="theme-color" content="#000000"/>
<link rel="icon" href="/favicon-32.png"/>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .logo{width:88px;height:88px;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
  h1{font-size:22px;font-weight:700;margin:0 0 8px;letter-spacing:-0.02em}
  p{font-size:14px;opacity:.6;margin:0 0 32px;max-width:280px;line-height:1.5}
  button{background:#fff;color:#000;border:0;padding:14px 28px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
    <h1>You're offline</h1>
    <p>Your posts and messages will send automatically once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
